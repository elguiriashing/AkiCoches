name: AkiCoches Android bundle
on:
  pull_request:
    paths: ["Android/**", ".github/workflows/android-play.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Generate pinned Gradle wrapper
        run: gradle --no-daemon wrapper --gradle-version 9.5.0 --distribution-type bin
      - run: ./gradlew --no-daemon test lint bundleRelease assembleRelease assembleDebug
      - name: Package Android Studio project
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p ../android-studio-project
          rsync -a --exclude='build/' --exclude='.gradle/' --exclude='local.properties' --exclude='*.jks' --exclude='*.keystore' --exclude='keystore.properties' ./ ../android-studio-project/
          printf '%s\n' "$SOURCE_COMMIT" > ../android-studio-project/BUILD-SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: akicoches-android-studio-project
          path: android-studio-project/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: akicoches-android-unsigned
          path: |
            Android/app/build/outputs/bundle/release/*.aab
            Android/app/build/outputs/apk/release/*.apk
            Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
